<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function f1()
        {
            let a=document.getElementById("num").value 
            msg.innerHTML = "";
            for(let i=1;i<=10;i++)
        {
            msg.innerHTML += `${a} x ${i} = ${a * i} <br>`;
        }
        }
    </script>
</head>
<body>
    <p><input type="number" id="num" onchange="f1()"></p>
    <!-- <button onclick="f1()">Submit</button> -->
    <hr>
    <div id="msg"></div>
</body>
</html>
